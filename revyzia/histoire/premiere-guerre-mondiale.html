          <p><strong>Accroche / introduction.</strong> De 1914 à 1918, l'Europe est déchirée par la Première Guerre mondiale, première <em>guerre totale</em> de l'histoire. Déclenchée par l'assassinat de l'archiduc François-Ferdinand à Sarajevo (28 juin 1914) et le jeu des alliances (Triple-Entente contre Triple-Alliance), elle bouleverse profondément les sociétés européennes. Comment ?</p>
          <p><strong>I. Une guerre totale qui mobilise militaires et civils.</strong> Le conflit mobilise toutes les ressources d'un pays. Au front, les soldats (les « poilus ») connaissent la guerre de mouvement (1914), puis la guerre de position dans les tranchées (Verdun, 1916). À l'arrière, les civils sont mobilisés : femmes et colonisés travaillent dans les usines d'armement, l'État lève des impôts et emprunte. La propagande entretient une « culture de guerre » qui désigne l'ennemi comme le Mal.</p>
          <p><strong>II. Une violence de masse contre les soldats et les civils.</strong> La violence est physique (artillerie, gaz, mitrailleuses) et psychologique (peur, traumatismes). Elle frappe aussi les civils : bombardements, privations, et surtout le génocide arménien de 1915, premier génocide du XXe siècle, organisé par le gouvernement turc (2/3 de la population arménienne exterminés).</p>
          <p><strong>III. Des conséquences immenses.</strong> En 1917, l'entrée des États-Unis et les révolutions russes font basculer la guerre. L'armistice du 11 novembre 1918 met fin aux combats. Le bilan est désastreux : ≈ 10 millions de soldats morts, des sociétés « brutalisées ». Le traité de Versailles (1919), vécu comme un « diktat » par l'Allemagne, redessine l'Europe sans apaiser les tensions.</p>
          <p><strong>Conclusion.</strong> La Première Guerre mondiale a donc transformé les sociétés européennes par l'ampleur de sa mobilisation, de sa violence et de ses conséquences, préparant les crises de l'entre-deux-guerres.</p>` }
