          <p><strong>Introduction.</strong> De 1939 à 1945, la Seconde Guerre mondiale est une guerre d'anéantissement : elle vise à détruire l'adversaire, sans distinction entre civils et militaires. Pourquoi peut-on la qualifier ainsi ?</p>
          <p><strong>I. Un affrontement planétaire et total.</strong> La guerre oppose les Alliés à l'Axe sur tous les continents. La mobilisation est totale : ressources humaines, économiques (Victory Program), scientifiques (bombe atomique) et idéologiques (propagande).</p>

          <p><strong>Conclusion.</strong> Par l'ampleur planétaire, la mobilisation totale, la violence contre les civils et le génocide, la Seconde Guerre mondiale est bien une guerre d'anéantissement. Les crimes nazis seront jugés à Nuremberg.</p>` }
