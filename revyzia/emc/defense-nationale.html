      { chapter: 'Histoire', title: 'Du service militaire obligatoire à la JDC', body: `
        <p>L'esprit de défense chez les citoyens a beaucoup évolué :</p>
        <ul>
          <li>📅 <strong>De 1798 à 1997 (200 ans)</strong> : Le service militaire est <strong>obligatoire</strong> pour tous les hommes</li>
          <li>📅 <strong>1997</strong> : Le président <strong>Jacques Chirac</strong> professionnalise les armées et remplace le service militaire par un <strong>parcours de citoyenneté en 3 étapes</strong></li>
        </ul>
        <div class="def"><strong>Les 3 étapes du parcours de citoyenneté</strong>
        1. 🏫 <strong>École</strong> : Enseignement de défense en 3e et 1re (comprendre la République, devoir de défense)<br>
        2. 🏛️ <strong>Mairie</strong> : Recensement à 16 ans (pour être convoqué à la JDC)<br>
        3. 🪖 <strong>Armée</strong> : La JDC (Journée Défense et Citoyenneté) avant 18 ans</div>` },
      { chapter: 'JDC', title: 'La JDC : Journée Défense et Citoyenneté', body: `
        <div class="def"><strong>JDC (Journée Défense et Citoyenneté)</strong> : Journée de sensibilisation aux enjeux de la défense et de la sécurité nationale. Obligatoire avant 18 ans.</div>
        <p><strong>Ce qu'on fait à la JDC :</strong></p>
        <ul>
          <li>Rencontre avec des femmes et des hommes de la défense</li>
          <li>Sensibilisation aux enjeux de défense et sécurité</li>
          <li>Test de détection des difficultés de lecture</li>
        </ul>
        <div class="example"><strong>Ordre du parcours</strong> : Enseignement de défense (3e/1re) → Recensement en mairie à 16 ans → JDC avant 18 ans</div>` },
      { chapter: 'SNU', title: 'Le Service National Universel (SNU)', body: `
        <div class="def"><strong>SNU</strong> : Projet lancé en <strong>2018</strong> par le président <strong>Emmanuel Macron</strong> pour remplacer la JDC. Concerne les garçons ET les filles de <strong>15 à 16 ans</strong>.</div>
        <p><strong>Objectifs :</strong></p>
        <ul>
          <li>Renforcer la <strong>cohésion nationale</strong> autour des valeurs de la République</li>
          <li>Développer une <strong>culture de l'engagement</strong></li>
        </ul>
        <p><strong>3 étapes du SNU :</strong></p>
        <ol>
          <li>🏕️ <strong>Séjour de cohésion</strong> (2 semaines) : Vie en communauté, code de la route, premiers secours, Marseillaise chaque matin → <strong>OBLIGATOIRE</strong></li>
          <li>🌱 <strong>Mission d'intérêt général</strong> (2 semaines) : Soutenir une cause (sport, environnement, santé...) → <strong>FACULTATIF</strong></li>
          <li>🎖️ <strong>Engagement</strong> (3 mois min.) : Missions de défense, préservation patrimoine/environnement, accompagnement personnes → <strong>FACULTATIF</strong></li>
        </ol>
        <div class="warning"><strong>Important !</strong> Aujourd'hui le SNU est encore en phase de test. Il <strong>n'est pas encore obligatoire</strong>.</div>` },
      { chapter: 'Engagement volontaire', title: 'Service civique et réserve militaire', body: `
        <p>Au-delà de la JDC/SNU, on peut développer l'esprit de défense volontairement :</p>
        <div class="def"><strong>Service civique</strong> : Engagement volontaire pour les jeunes de <strong>16 à 25 ans</strong>, d'une durée de <strong>6 mois à 1 an</strong>, pour l'accomplissement d'une mission d'intérêt général.</div>
        <div class="def"><strong>Réserve militaire</strong> : Personne qui consacre <strong>une partie de son temps</strong> à une activité de Défense nationale (sans être militaire à temps plein).</div>
        <div class="example"><strong>Exemple</strong> : Un enseignant peut être réserviste militaire le week-end ou pendant les vacances.</div>` },
