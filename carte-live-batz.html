<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Batz Street View — rues au vert</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  :root{--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
  #map{position:absolute;inset:0;background:#cfe8f2}
  .leaflet-control-attribution{font-size:9px;opacity:.6}
  /* barre haut */
  #bar{position:absolute;top:0;left:0;right:0;z-index:1000;display:flex;gap:10px;align-items:center;
       padding:calc(8px + var(--safe-t)) 14px 8px;
       background:linear-gradient(180deg,rgba(15,23,42,.92),rgba(15,23,42,.72));color:#fff;backdrop-filter:blur(6px)}
  #recdot{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;white-space:nowrap}
  #recdot .led{width:10px;height:10px;border-radius:50%;background:#94a3b8}
  #recdot.on .led{background:#f87171;box-shadow:0 0 0 4px rgba(248,113,113,.25);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(248,113,113,0)}}
  #pct{font-size:22px;font-weight:800;color:#4ade80;line-height:1}
  #rest{font-size:12px;opacity:.85}
  .grow{flex:1}
  #status{font-size:11px;opacity:.85;white-space:nowrap;text-align:right}
  /* dock bas */
  #dock{position:absolute;left:0;right:0;bottom:calc(14px + var(--safe-b));z-index:1000;
        display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
  #dock>*{pointer-events:auto}
  #startBtn{border:0;border-radius:40px;padding:17px 34px;font-size:19px;font-weight:800;color:#fff;letter-spacing:.2px;
        background:linear-gradient(180deg,#22c55e,#16a34a);box-shadow:0 6px 20px rgba(22,163,74,.45);min-width:250px}
  #startBtn.on{background:linear-gradient(180deg,#ef4444,#dc2626);box-shadow:0 6px 20px rgba(220,38,38,.45)}
  #startBtn:active{transform:translateY(1px)}
  #row{display:flex;gap:10px}
  #row button{border:0;border-radius:26px;padding:12px 18px;font-size:14px;font-weight:700;color:#fff;
        background:rgba(30,41,59,.92);box-shadow:0 3px 10px rgba(0,0,0,.3);backdrop-filter:blur(4px)}
  #row button.active{background:#2563eb}
  /* menu */
  #menu{position:absolute;right:12px;bottom:calc(160px + var(--safe-b));z-index:1200;background:#0f172a;color:#fff;border-radius:16px;
        padding:8px;display:none;flex-direction:column;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);min-width:220px}
  #menu.open{display:flex}
  #menu button{border:0;border-radius:11px;padding:13px;font-size:15px;font-weight:600;text-align:left;color:#fff;background:#1e293b}
  #menu button.danger{background:#7f1d1d}
  #hint{position:absolute;left:12px;right:12px;top:calc(58px + var(--safe-t));z-index:900;
        background:rgba(37,99,235,.96);color:#fff;padding:11px 14px;border-radius:14px;font-size:14px;font-weight:600;text-align:center;
        box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .me{width:22px;height:22px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 2px #2563eb,0 2px 6px rgba(0,0,0,.4)}
  #overlay{position:absolute;inset:0;z-index:2000;background:rgba(15,23,42,.95);color:#fff;display:flex;flex-direction:column;
       align-items:center;justify-content:center;text-align:center;padding:26px;gap:16px}
  #overlay h1{font-size:20px;margin:0}#overlay p{margin:0;max-width:440px;line-height:1.5;font-size:15px;opacity:.9}
  #overlay button{border:0;border-radius:26px;padding:14px 24px;font-size:16px;font-weight:700;background:#2563eb;color:#fff}
  .hide{display:none!important}
  .spin{width:36px;height:36px;border:4px solid #ffffff30;border-top-color:#4ade80;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="bar">
  <span id="recdot" class="off"><span class="led"></span><span id="recTxt">Pause</span></span>
  <span><span id="pct">0%</span> <span id="rest">reste …</span></span>
  <span class="grow"></span><span id="status">GPS: —</span>
</div>
<div id="map"></div>
<div id="hint">Appuie sur <b>Démarrer</b> quand tu commences à filmer. Rien ne s'enregistre avant.</div>

<div id="menu">
  <button id="mSave">💾 Sauvegarder (fichier)</button>
  <button id="mLoad">📂 Restaurer un fichier</button>
  <button id="mReload" style="background:#334155">↻ Recharger les rues</button>
  <button id="mReset" class="danger">🗑️ Tout réinitialiser</button>
  <input id="file" type="file" accept="application/json,.json" class="hide"/>
</div>

<div id="dock">
  <button id="startBtn">▶ Démarrer le tournage</button>
  <div id="row"><button id="follow" class="active">📍 Me suivre</button><button id="menuBtn">☰ Menu</button></div>
</div>

<div id="overlay"><div class="spin" id="spin"></div><h1 id="ovt">Préparation de la carte…</h1>
  <p id="ovp">On récupère les rues de l'île (une seule fois, ensuite en cache). Fais-le avec du réseau.</p>
  <button id="ovb" class="hide">Réessayer</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const BBOX=[48.740,-4.050,48.758,-4.000];
const OVERPASS=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter",
  "https://overpass.openstreetmap.fr/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
const QUERY=`[out:json][timeout:60];way["highway"](${BBOX[0]},${BBOX[1]},${BBOX[2]},${BBOX[3]});out geom;`;
const FOOT=new Set(["footway","path","steps","bridleway","corridor"]);
const STEP=4;          // m : longueur d'un tronçon (précision fine)
const NEAR_MAX=16;     // m : distance max pour marquer la rue la plus proche
const CLUSTER=3;       // m : on marque le petit paquet autour du point le plus proche
const MAX_ACC=30;      // m : au-delà, précision trop mauvaise -> on ne marque pas
const MIN_SPEED=0.4;   // m/s : en dessous (à l'arrêt) -> on ne marque pas
const K_COV="batzsv_covered_v2", K_OSM="batzsv_osm_v1";
let map, canvas, segs=[], covered=new Set(), meMarker=null, accCircle=null, follow=true, watching=false, recording=false;

const el=id=>document.getElementById(id);
const saveCov=()=>{try{localStorage.setItem(K_COV,JSON.stringify([...covered]));}catch(e){}};
function loadCov(){try{covered=new Set(JSON.parse(localStorage.getItem(K_COV)||"[]"));}catch(e){covered=new Set();}}
function fail(msg){el("overlay").classList.remove("hide");el("spin").classList.add("hide");el("ovt").textContent="Souci";el("ovp").textContent=msg;el("ovb").classList.remove("hide");}
window.onerror=(m)=>{fail("Erreur inattendue : "+m+". Touche « Réessayer ».");};

function toXY(lat,lon,lat0){return[lon*111320*Math.cos(lat0*Math.PI/180),lat*110540];}
function metersBetween(a,b){const A=toXY(a[0],a[1],a[0]),B=toXY(b[0],b[1],a[0]);return Math.hypot(B[0]-A[0],B[1]-A[1]);}
function distPtSeg(plat,plon,a,b){const P=toXY(plat,plon,plat),A=toXY(a[0],a[1],plat),B=toXY(b[0],b[1],plat);
  const vx=B[0]-A[0],vy=B[1]-A[1],wx=P[0]-A[0],wy=P[1]-A[1];const l2=vx*vx+vy*vy;let t=l2>0?(wx*vx+wy*vy)/l2:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(P[0]-(A[0]+t*vx),P[1]-(A[1]+t*vy));}

function initMap(){canvas=L.canvas({padding:.5});
  map=L.map("map",{zoomControl:false,renderer:canvas,tap:true}).setView([48.7485,-4.024],15);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OSM"}).addTo(map);
  map.on("dragstart",()=>{follow=false;el("follow").classList.remove("active");});}
function styleFor(s){if(covered.has(s.id))return{color:"#16a34a",weight:7,opacity:.98};
  if(s.foot)return{color:"#9ca3af",weight:2,opacity:.55,dashArray:"2 7"};return{color:"#64748b",weight:4,opacity:.85};}
function densify(a,b){const len=metersBetween(a,b),n=Math.max(1,Math.round(len/STEP)),out=[];
  for(let i=0;i<n;i++){const t0=i/n,t1=(i+1)/n;out.push([[a[0]+(b[0]-a[0])*t0,a[1]+(b[1]-a[1])*t0],[a[0]+(b[0]-a[0])*t1,a[1]+(b[1]-a[1])*t1]]);}return out;}
function buildSegments(data){segs.forEach(s=>map.removeLayer(s.line));segs=[];
  data.elements.filter(e=>e.type==="way"&&e.geometry&&e.geometry.length>1).forEach(w=>{
    const foot=FOOT.has((w.tags&&w.tags.highway)||"");
    if(foot){for(let i=0;i<w.geometry.length-1;i++){const A=[w.geometry[i].lat,w.geometry[i].lon],B=[w.geometry[i+1].lat,w.geometry[i+1].lon];
        const s={id:"f"+w.id+"-"+i,a:A,b:B,foot:true,mid:[(A[0]+B[0])/2,(A[1]+B[1])/2]};s.line=L.polyline([A,B],styleFor(s)).addTo(map);segs.push(s);}return;}
    for(let i=0;i<w.geometry.length-1;i++){const A=[w.geometry[i].lat,w.geometry[i].lon],B=[w.geometry[i+1].lat,w.geometry[i+1].lon];
      densify(A,B).forEach((mm,k)=>{const id=w.id+"-"+i+"-"+k;
        const s={id,a:mm[0],b:mm[1],foot:false,mid:[(mm[0][0]+mm[1][0])/2,(mm[0][1]+mm[1][1])/2]};
        s.line=L.polyline(mm,styleFor(s)).addTo(map);s.line.on("click",()=>toggle(s));segs.push(s);});}});
  const b=L.latLngBounds([]);segs.forEach(s=>{b.extend(s.a);b.extend(s.b);});if(segs.length)map.fitBounds(b.pad(0.05));updateStats();}
function toggle(s){if(s.foot)return;covered.has(s.id)?covered.delete(s.id):covered.add(s.id);s.line.setStyle(styleFor(s));saveCov();updateStats();}
function recolor(){segs.forEach(s=>s.line.setStyle(styleFor(s)));}
function updateStats(){const r=segs.filter(s=>!s.foot),d=r.filter(s=>covered.has(s.id)).length,p=r.length?Math.round(100*d/r.length):0;
  el("pct").textContent=p+"%";el("rest").textContent="reste "+(r.length-d);}

function setRecording(on){recording=on;
  el("startBtn").textContent=on?"⏹ Arrêter":"▶ Démarrer le tournage";el("startBtn").classList.toggle("on",on);
  el("recTxt").textContent=on?"Enregistrement":"Pause";el("recdot").className=on?"on":"off";
  el("hint").classList.toggle("hide",on);}

function markNear(la,lo,ac){
  // trouve le tronçon route le plus proche, puis marque le petit paquet autour (précis, une seule rue)
  let best=Infinity,cand=[];
  for(const s of segs){if(s.foot||covered.has(s.id))continue;
    if(Math.abs(s.mid[0]-la)>0.0007||Math.abs(s.mid[1]-lo)>0.0010)continue;
    const d=distPtSeg(la,lo,s.a,s.b);cand.push([s,d]);if(d<best)best=d;}
  const thr=Math.max(8,Math.min(ac,NEAR_MAX));
  if(best>thr)return false;let ch=false;
  for(const [s,d] of cand){if(d<=best+CLUSTER){covered.add(s.id);s.line.setStyle(styleFor(s));ch=true;}}
  if(ch){saveCov();updateStats();}return ch;}

function onPos(p){const {latitude:la,longitude:lo,accuracy:ac,speed}=p.coords;
  el("status").textContent="GPS: ±"+Math.round(ac)+" m"+(ac>40?" (faible)":"");
  if(!meMarker){meMarker=L.marker([la,lo],{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map);
    accCircle=L.circle([la,lo],{radius:ac,color:"#2563eb",weight:1,opacity:.35,fillOpacity:.07}).addTo(map);}
  else{meMarker.setLatLng([la,lo]);accCircle.setLatLng([la,lo]).setRadius(ac);}
  if(follow)map.setView([la,lo],Math.max(map.getZoom(),18),{animate:true});
  if(!recording)return;
  if(ac>MAX_ACC)return;                          // précision trop mauvaise
  if(speed!=null&&speed<MIN_SPEED)return;        // à l'arrêt -> pas de marquage
  markNear(la,lo,ac);}
function onPosErr(e){watching=false;
  if(e.code===1){el("status").textContent="Localisation refusée";
    fail("Localisation refusée. Autorise-la (cadenas dans la barre d'adresse → Localisation → Autoriser) puis « Réessayer ». Un fichier local (file://) bloque le GPS : passe par un lien https.");}
  else el("status").textContent="GPS indisponible";}
function requestGeo(){if(!navigator.geolocation){el("status").textContent="Pas de GPS ici";return;}
  el("status").textContent="GPS: recherche…";
  navigator.geolocation.getCurrentPosition(p=>{el("overlay").classList.add("hide");onPos(p);
    if(!watching){watching=true;navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:1000,timeout:20000});}},
    onPosErr,{enableHighAccuracy:true,timeout:20000,maximumAge:0});}

async function wakeLock(){try{if("wakeLock"in navigator){let wl=await navigator.wakeLock.request("screen");
  document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"){try{wl=await navigator.wakeLock.request("screen");}catch(e){}}});}}catch(e){}}

function fetchOne(url){return new Promise(async(res,rej)=>{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),10000);
  try{const r=await fetch(url,{method:"POST",body:"data="+encodeURIComponent(QUERY),headers:{"Content-Type":"application/x-www-form-urlencoded"},signal:ctl.signal});
    clearTimeout(to);if(!r.ok)return rej();const j=await r.json();if(j&&j.elements&&j.elements.length)res(j);else rej();}catch(e){clearTimeout(to);rej();}});}
async function fetchStreets(){try{return await Promise.any(OVERPASS.map(fetchOne));}catch(e){return null;}}
async function loadStreets(force){el("overlay").classList.remove("hide");el("spin").classList.remove("hide");el("ovb").classList.add("hide");
  el("ovt").textContent="Préparation de la carte…";el("ovp").textContent="On récupère les rues de l'île (une fois, ensuite en cache).";
  let data=null;if(!force){const c=localStorage.getItem(K_OSM);if(c){try{data=JSON.parse(c);}catch(e){}}}
  if(!data){data=await fetchStreets();if(data)try{localStorage.setItem(K_OSM,JSON.stringify(data));}catch(e){}}
  if(!data){fail("Impossible de charger les rues (réseau lent/coupé). Vérifie ta connexion et touche « Réessayer ».");return;}
  try{buildSegments(data);}catch(e){fail("Souci d'affichage. Touche « Réessayer ».");return;}
  el("overlay").classList.add("hide");requestGeo();}

function doSave(){const blob=new Blob([JSON.stringify({v:2,ts:Date.now(),covered:[...covered]})],{type:"application/json"});
  const a=document.createElement("a");const d=new Date(),pad=n=>String(n).padStart(2,"0");
  a.download=`batz-progression-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  a.href=URL.createObjectURL(blob);a.click();}
function doLoad(file){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);(j.covered||[]).forEach(id=>covered.add(id));
  saveCov();recolor();updateStats();alert("Progression restaurée ✔");}catch(e){alert("Fichier illisible.");}};r.readAsText(file);}

function initButtons(){
  el("startBtn").onclick=()=>setRecording(!recording);
  el("follow").onclick=()=>{follow=true;el("follow").classList.add("active");if(meMarker)map.setView(meMarker.getLatLng(),Math.max(map.getZoom(),18));};
  el("menuBtn").onclick=()=>el("menu").classList.toggle("open");
  el("mSave").onclick=()=>{doSave();el("menu").classList.remove("open");};
  el("mLoad").onclick=()=>el("file").click();
  el("file").onchange=e=>{if(e.target.files[0])doLoad(e.target.files[0]);e.target.value="";el("menu").classList.remove("open");};
  el("mReload").onclick=()=>{el("menu").classList.remove("open");loadStreets(true);};
  el("mReset").onclick=()=>{if(confirm("Effacer TOUTE la progression ? (pense à Sauvegarder avant)")){
     if(confirm("Confirmer : tout repasse en gris.")){covered.clear();saveCov();recolor();updateStats();}}el("menu").classList.remove("open");};
  el("ovb").onclick=()=>loadStreets(true);
}
try{loadCov();initMap();initButtons();setRecording(false);wakeLock();loadStreets(false);}catch(e){fail("Erreur au démarrage : "+(e&&e.message));}
</script>
</body>
</html>
